services:
  fastapi_app:
    build: .
    # Apply pending migrations before serving so the schema always matches the code.
    command: sh -c "alembic upgrade head && fastapi run --reload --host 0.0.0.0 app/main.py"
    env_file:
      - .env
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ./tests:/code/tests
      - ./eval:/code/eval
      - ./samples:/code/samples
    ports:
      - "8000:8000"
    networks:
      - rag
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

  # React UI (Vite dev server). Calls go to /api/..., which Vite forwards to fastapi_app.
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_TARGET: http://fastapi_app:8000
      VITE_POLL: "1"
    volumes:
      - ./frontend:/app
      # node_modules lives in a volume, not in the OneDrive-synced project folder.
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - rag
    depends_on:
      - fastapi_app

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    networks:
      - rag
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  rag:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  mysql_data:
    driver: local
  frontend_node_modules:
    driver: local
