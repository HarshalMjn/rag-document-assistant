services:
  fastapi_app:
    build: .
    command:
      - fastapi
      - run
      - --reload
      - --host
      - "0.0.0.0"
      - "app/main.py"
    env_file:
      - .env
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
    ports:
      - "8000:8000"
    networks:
      - rag
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "3306:3306"
    networks:
      - rag
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

networks:
  rag:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  mysql_data:
    driver: local
