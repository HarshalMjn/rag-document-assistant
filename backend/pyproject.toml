[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Source-grounded document assistant using RAG, Qdrant and FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.12,<1.0.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "qdrant-client>=1.15.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "asyncmy>=0.2.10",
    "cryptography>=45.0.2",
    "alembic>=1.15.2",
    "google-genai>=1.20.0",
    "pymupdf>=1.26.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls the real Gemini and Groq APIs (needs API keys)"]
# Live tests are opt-in: run them with `pytest -m live`.
addopts = ["-m", "not live"]

[tool.ruff]
target-version = "py312"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # function calls in default function arguments
]
